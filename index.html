<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Portal — Sign in</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0;
    }
    .card {
      background: #fff; padding: 40px 36px; border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08); width: 360px;
    }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p  { color: #667; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
    input[type=text], input[type=password] {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1px solid #ccd2d9; border-radius: 6px; font-size: 14px; margin-bottom: 18px;
    }
    input[type=text]:focus, input[type=password]:focus {
      outline: none; border-color: #0a7bff; box-shadow: 0 0 0 3px rgba(10,123,255,.15);
    }
    button {
      width: 100%; padding: 11px; background: #0a7bff; color: #fff;
      border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Project Portal</h1>
    <p>Sign in to continue to your workspace.</p>
    <form id="login" action="javascript:void(0)" method="post">
      <label for="username">Email or username</label>
      <input type="text" id="username" name="username" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    // PoC page only — submit does nothing, no data leaves this page.
    document.getElementById('login').addEventListener('submit', function (e) {
      e.preventDefault();
      document.querySelector('button').textContent = 'This is a security test page — nothing sent';
    });
  </script>
</body>
</html>
